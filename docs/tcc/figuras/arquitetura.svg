<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <title>Caminho do preço no SuperPreço</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a372f"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- Linha de cima: coleta -->
  <text x="24" y="34" font-size="13" font-weight="700" fill="#6b665b" letter-spacing="1">1. COLETA (duas vezes por dia, 6h e 18h)</text>

  <rect x="24" y="52" width="190" height="96" rx="10" fill="#f3ecdf" stroke="#3a372f" stroke-width="1.5"/>
  <text x="119" y="80" font-size="15" font-weight="700" fill="#1d1b16" text-anchor="middle">Sites dos</text>
  <text x="119" y="100" font-size="15" font-weight="700" fill="#1d1b16" text-anchor="middle">supermercados</text>
  <text x="119" y="122" font-size="12" fill="#3a372f" text-anchor="middle">SuperVale, Vila Sul,</text>
  <text x="119" y="138" font-size="12" fill="#3a372f" text-anchor="middle">San Michel e Pedrilho</text>

  <rect x="290" y="52" width="250" height="96" rx="10" fill="#eef6f0" stroke="#1f7a45" stroke-width="1.5"/>
  <text x="415" y="84" font-size="15" font-weight="700" fill="#0c3d24" text-anchor="middle">Robô de coleta</text>
  <text x="415" y="106" font-size="12" fill="#3a372f" text-anchor="middle">abre cada site num navegador e lê</text>
  <text x="415" y="122" font-size="12" fill="#3a372f" text-anchor="middle">nome, preço, link e data da coleta</text>
  <text x="415" y="140" font-size="11" fill="#6b665b" text-anchor="middle">(Selenium WebDriver, no GitHub Actions)</text>

  <rect x="616" y="52" width="260" height="96" rx="10" fill="#eef6f0" stroke="#1f7a45" stroke-width="1.5"/>
  <text x="746" y="84" font-size="15" font-weight="700" fill="#0c3d24" text-anchor="middle">Organização</text>
  <text x="746" y="106" font-size="12" fill="#3a372f" text-anchor="middle">padroniza nomes e categorias, calcula</text>
  <text x="746" y="122" font-size="12" fill="#3a372f" text-anchor="middle">o preço por kg/L e guarda o histórico</text>
  <text x="746" y="140" font-size="11" fill="#6b665b" text-anchor="middle">(Node.js)</text>

  <line x1="214" y1="100" x2="286" y2="100" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="540" y1="100" x2="612" y2="100" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Banco no meio -->
  <rect x="616" y="196" width="260" height="78" rx="10" fill="#fff6cc" stroke="#9a7a00" stroke-width="1.5"/>
  <text x="746" y="228" font-size="15" font-weight="700" fill="#1d1b16" text-anchor="middle">Banco de dados</text>
  <text x="746" y="250" font-size="12" fill="#3a372f" text-anchor="middle">cerca de 27 mil produtos e seus preços</text>
  <text x="746" y="266" font-size="11" fill="#6b665b" text-anchor="middle">(MongoDB, no MongoDB Atlas)</text>
  <line x1="746" y1="148" x2="746" y2="192" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Linha de baixo: consulta -->
  <text x="24" y="306" font-size="13" font-weight="700" fill="#6b665b" letter-spacing="1">2. CONSULTA (a qualquer momento)</text>

  <rect x="616" y="322" width="260" height="96" rx="10" fill="#eef6f0" stroke="#1f7a45" stroke-width="1.5"/>
  <text x="746" y="354" font-size="15" font-weight="700" fill="#0c3d24" text-anchor="middle">API (intermediário)</text>
  <text x="746" y="376" font-size="12" fill="#3a372f" text-anchor="middle">busca, compara os mercados e</text>
  <text x="746" y="392" font-size="12" fill="#3a372f" text-anchor="middle">monta a cotação da lista de compras</text>
  <text x="746" y="410" font-size="11" fill="#6b665b" text-anchor="middle">(Node.js e Express.js, no Render)</text>
  <line x1="760" y1="274" x2="760" y2="318" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="732" y1="318" x2="732" y2="278" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="290" y="322" width="250" height="96" rx="10" fill="#eef6f0" stroke="#1f7a45" stroke-width="1.5"/>
  <text x="415" y="354" font-size="15" font-weight="700" fill="#0c3d24" text-anchor="middle">Site do SuperPreço</text>
  <text x="415" y="376" font-size="12" fill="#3a372f" text-anchor="middle">telas de busca, comparação,</text>
  <text x="415" y="392" font-size="12" fill="#3a372f" text-anchor="middle">lista de compras e painel</text>
  <text x="415" y="410" font-size="11" fill="#6b665b" text-anchor="middle">(React.js e Tailwind CSS, no Cloudflare Pages)</text>
  <line x1="612" y1="362" x2="544" y2="362" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="544" y1="384" x2="612" y2="384" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="24" y="322" width="190" height="96" rx="10" fill="#f3ecdf" stroke="#3a372f" stroke-width="1.5"/>
  <text x="119" y="362" font-size="15" font-weight="700" fill="#1d1b16" text-anchor="middle">Consumidor</text>
  <text x="119" y="384" font-size="12" fill="#3a372f" text-anchor="middle">no celular, tablet</text>
  <text x="119" y="400" font-size="12" fill="#3a372f" text-anchor="middle">ou computador</text>
  <line x1="286" y1="362" x2="218" y2="362" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="218" y1="384" x2="286" y2="384" stroke="#3a372f" stroke-width="2" marker-end="url(#seta)"/>
</svg>
