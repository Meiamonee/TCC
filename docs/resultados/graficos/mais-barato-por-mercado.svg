<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Quando o mesmo produto está em vários mercados, quem cobra menos?">
  <title>Quando o mesmo produto está em vários mercados, quem cobra menos?</title>
  <rect width="760" height="260" fill="#ffffff"/>
  <text x="16" y="28" font-size="17" font-weight="700" fill="#1d1b16">Quando o mesmo produto está em vários mercados, quem cobra menos?</text>
  <text x="16" y="50" font-size="12.5" fill="#6b665b">Percentual das comparações em que o mercado tem o menor preço (empates divididos)</text>
  <line x1="190" y1="68" x2="190" y2="202" stroke="#e6dcc8" stroke-width="1"/>
  <text x="190" y="218" font-size="11" fill="#6b665b" text-anchor="middle">0%</text>
  <line x1="350" y1="68" x2="350" y2="202" stroke="#e6dcc8" stroke-width="1"/>
  <text x="350" y="218" font-size="11" fill="#6b665b" text-anchor="middle">20%</text>
  <line x1="510" y1="68" x2="510" y2="202" stroke="#e6dcc8" stroke-width="1"/>
  <text x="510" y="218" font-size="11" fill="#6b665b" text-anchor="middle">40%</text>
  <line x1="670" y1="68" x2="670" y2="202" stroke="#e6dcc8" stroke-width="1"/>
  <text x="670" y="218" font-size="11" fill="#6b665b" text-anchor="middle">60%</text>
  <line x1="190" y1="68" x2="190" y2="202" stroke="#6b665b" stroke-width="1"/>
  <text x="180" y="89" font-size="13" fill="#1d1b16" text-anchor="end">San Michel</text>
  <path d="M192,74 H662 Q666,74 666,78 V92 Q666,96 662,96 H192 Z" fill="#1f7a45"/>
  <text x="674" y="89" font-size="13" font-weight="600" fill="#1d1b16">59,5% de 2.947</text>
  <text x="180" y="123" font-size="13" fill="#1d1b16" text-anchor="end">Pedrilho</text>
  <path d="M192,108 H622.8 Q626.8,108 626.8,112 V126 Q626.8,130 622.8,130 H192 Z" fill="#1f7a45"/>
  <text x="634.8" y="123" font-size="13" font-weight="600" fill="#1d1b16">54,6% de 2.947</text>
  <text x="180" y="157" font-size="13" fill="#1d1b16" text-anchor="end">SuperVale</text>
  <path d="M192,142 H400.4 Q404.4,142 404.4,146 V160 Q404.4,164 400.4,164 H192 Z" fill="#1f7a45"/>
  <text x="412.4" y="157" font-size="13" font-weight="600" fill="#1d1b16">26,8% de 2.337</text>
  <text x="180" y="191" font-size="13" fill="#1d1b16" text-anchor="end">Vila Sul</text>
  <path d="M192,176 H354 Q358,176 358,180 V194 Q358,198 354,198 H192 Z" fill="#1f7a45"/>
  <text x="366" y="191" font-size="13" font-weight="600" fill="#1d1b16">21% de 3.364</text>
  <text x="16" y="250" font-size="11" fill="#6b665b">Fonte: dados coletados pelo SuperPreço</text>
</svg>
