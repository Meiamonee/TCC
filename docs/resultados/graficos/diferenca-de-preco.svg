<svg xmlns="http://www.w3.org/2000/svg" width="760" height="294" viewBox="0 0 760 294" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Diferença entre o maior e o menor preço do mesmo produto">
