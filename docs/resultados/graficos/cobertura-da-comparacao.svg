<svg xmlns="http://www.w3.org/2000/svg" width="760" height="226" viewBox="0 0 760 226" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Produtos que podem ser comparados com outro mercado">
