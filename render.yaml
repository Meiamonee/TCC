# Configuracao da API no Render (plano gratuito). Criada pelo painel do Render em
# New > Blueprint, apontando para este repositorio. Ver docs/implantacao.md.
services:
  - type: web
    name: superpreco-api
    runtime: node
    plan: free
    # O Render nao tem servidor no Brasil; Virginia e a regiao mais proxima.
    region: virginia
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # O servidor gratuito nao tem Chrome; a coleta com Selenium roda em outra maquina
      # e grava no mesmo banco (MongoDB Atlas).
      - key: SCHEDULER_ENABLED
        value: "false"
      # O limite de requisicoes e por IP do visitante. O Render fica atras da Cloudflare, que
      # preenche CF-Connecting-IP com o IP real (o cliente nao consegue falsificar). O numero de
      # saltos no X-Forwarded-For varia entre requisicoes, entao ele nao e usado para isso
      # (conferido em 15/10/2026 com MOSTRAR_IP=true).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY
        value: "1"
      - key: MOSTRAR_IP
        value: "false"
      # Preenchidos no painel do Render (nao ficam no git).
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
